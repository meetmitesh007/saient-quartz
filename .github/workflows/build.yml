name: Build Saient Quartz for Android (CPU Only)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android-cpu:
    name: Compile Android CPU-Only arm64-v8a
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configure Pre-installed Android SDK and Licenses
      run: |
        # Use the native Android SDK pre-installed on GitHub cloud runners
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk-bundle" >> $GITHUB_ENV
        
        # Accept licenses natively using the pre-installed sdkmanager
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install Cargo NDK Extension
      run: cargo install cargo-ndk

    - name: Compile Native Engine for CPU
      run: |
        if [ -f "Cargo.toml" ]; then
          cargo ndk --target aarch64-linux-android --android-platform 24 build --release --no-default-features
        else
          echo "No Cargo.toml found. Create your Rust project structure first!"
          exit 1
        fi
      env:
        CFLAGS: "-march=armv8-a+simd+crypto"
        RUSTFLAGS: "-C target-feature=+neon"
        
