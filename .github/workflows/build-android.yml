name: Build Android Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK Toolchain
        uses: napi-rs/android-cross-action@v1
        with:
          target: aarch64-linux-android

      - name: Compile Directly via Cargo
        run: |
          cargo build --release --target aarch64-linux-android --features ""

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: quartz-android-cpu
          path: target/aarch64-linux-android/release/quartz
          
